# Fuses Dot Popper with `lota fuse` on this runner's platform (PACKAGING.md),
# as Lota 0.2.2's README documents: Lota's gem for the platform, from
# vendor/cache and checked against the SHA256SUMS of Lota's release, is
# installed, and lota fuse builds the app into $RUNNER_TEMP/fuse. It also
# writes $RUNNER_TEMP/build.txt, the lines a kit names its build by, and
# sets APP_VERSION from fledge.yml.
name: lota fuse
description: Fuse Dot Popper for this runner's platform with Lota's release gem
inputs:
  platform:
    description: Lota's gem platform, such as x64-mingw-ucrt
    required: true
runs:
  using: composite
  steps:
    - name: Name the build
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        version=$(ruby -ryaml -e 'print YAML.load_file("fledge.yml").fetch("version")')
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        {
          echo "Dot Popper $GITHUB_REF_NAME, commit $GITHUB_SHA, version $version"
          echo "Fused by lota fuse, from Lota $LOTA_VERSION's release gem for $PLATFORM"
          echo "Built $(date -u +%Y-%m-%d) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        } > "$RUNNER_TEMP/build.txt"
        cat "$RUNNER_TEMP/build.txt"

    - name: Check Lota's gem against its release, and install it
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gem_file="vendor/cache/lota-$LOTA_VERSION-$PLATFORM.gem"
        gh release download "v$LOTA_VERSION" -R setdef/Lota -p SHA256SUMS -D "$RUNNER_TEMP/lota-release"
        expected=$(grep " lota-$LOTA_VERSION-$PLATFORM.gem\$" "$RUNNER_TEMP/lota-release/SHA256SUMS" | cut -d' ' -f1)
        if command -v sha256sum > /dev/null; then actual=$(sha256sum "$gem_file" | cut -d' ' -f1); else actual=$(shasum -a 256 "$gem_file" | cut -d' ' -f1); fi
        echo "release: $expected"; echo "vendor/cache: $actual"
        [ -n "$expected" ] && [ "$expected" = "$actual" ]
        gem install --local "$gem_file"
        ruby -S lota --version

    # lota fuse installs every gem the lockfile locks, the development
    # group's too, and steep's json compiles there. On Windows that build
    # needs RubyInstaller's MSYS2 make and compiler, as lota fuse's error
    # says (ridk install), which the runner's MSYS2 lacks; RubyInstaller
    # enables them for a gem's extension. ridk is a .cmd, which PowerShell
    # runs and Git's bash does not.
    - name: Install RubyInstaller's MSYS2 development tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        ridk install 3
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # mkmf writes MSYS paths such as /C/... into the Makefile, which the
    # runner's own C:\mingw64 make, ahead of MSYS2's on the PATH, cannot
    # follow, so the step leaves C:\mingw64 off its PATH.
    - name: lota fuse
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vix '/c/mingw64/bin' | paste -sd: -)
          echo "make: $(command -v make || echo none); gcc: $(command -v gcc || echo none)"
        fi
        # lota fuse ships all of the folder it is given, as a fused LÖVE game
        # does, so it gets a copy without what only the repository needs.
        stage=$RUNNER_TEMP/game
        mkdir -p "$stage"
        git archive HEAD | tar -x -C "$stage"
        (cd "$stage" && rm -rf .github android ios test doc playtest script sig server Steepfile Rakefile \
          mise.toml INSIPIRATION.md PACKAGING.md README.md)
        (cd "$stage" && ruby -S lota fuse . --identifier "$IDENTIFIER" --app-version "$APP_VERSION" --icon icons/icon --out "$RUNNER_TEMP/fuse")
        ls -la "$RUNNER_TEMP/fuse"
