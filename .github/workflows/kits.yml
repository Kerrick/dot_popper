# Builds Dot Popper's playtest kits (PACKAGING.md, "Playtest kits"): one
# kit in, one results file out, per device. Each desktop kit holds the app
# `lota fuse` builds with Lota 0.2.2's release gem (.github/actions/fuse),
# on its own platform's runner, as the Package workflow builds the apps:
#
# - Windows x64: the game, playtest.ps1, which asks the hand checks one at
#   a time and writes one dot-popper-results.txt, and a README. The job
#   then runs the kit as a player would, unzipped with download marks,
#   answers fed on standard input, with Mesa's software OpenGL beside the
#   game since runners have no GPU, and checks the results file.
# - macOS arm64: the app, a README, and macos-results.txt to fill in. The
#   job plays the app by itself for a while first.
# - Linux x86_64 (glibc 2.39, so ubuntu-24.04): the game, playtest.sh,
#   which works as playtest.ps1 does, and a README, tested as the Windows
#   kit is, under Xvfb with Mesa.
# - iPad and iPhone (experimental): the Xcode project `fledge build ios`
#   writes, with Lota 0.2.2's experimental iOS engine built from a clone
#   of Lota at its v0.2.2 tag and Lota's iOS host, by the route of Lota's
#   doc/guide/phones.md, and ios-results.txt to fill in. A second, fresh runner builds that
#   project for the Simulator and, unsigned, for devices, and runs the
#   autoplay check of doc/ios.md.
#
# The Android kit has a workflow of its own (android.yml). A v* tag
# attaches the kits to the tag's GitHub Release.

name: Kits

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LOTA_VERSION: "0.2.2"
  # Only the iOS build names Fledge itself; lota fuse pins its own.
  FLEDGE_TAG: v0.7.0
  IDENTIFIER: com.setdef.DotPopper
  BUNDLE_FROZEN: "true"

jobs:
  windows:
    name: Windows x64 app and kit
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          windows-toolchain: none

      # The fuse action takes the app's version from fledge.yml; a tag's
      # build takes the tag's (playtest/kit.rb's BuildVersion), so the
      # header and lota fuse --app-version name it.
      - name: Take the version from the tag
        run: ruby script/playtest_kit.rb tag-version "$GITHUB_REF_NAME" fledge.yml

      - uses: ./.github/actions/fuse
        with:
          platform: x64-mingw-ucrt

      - name: Render playtest.ps1 and README.txt from playtest/
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          ruby script/playtest_kit.rb check-build "$GITHUB_REF_NAME" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb windows "$RUNNER_TEMP/rendered/playtest.ps1" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb text playtest/README-windows.txt "$RUNNER_TEMP/rendered/README.txt" "$RUNNER_TEMP/build.txt" --crlf

      - name: Parse playtest.ps1 in Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'rendered\playtest.ps1'
          $bad = 0
          foreach ($exe in 'powershell.exe', 'pwsh') {
            $command = "`$e = `$null; [void][Management.Automation.Language.Parser]::ParseFile('$path', [ref]`$null, [ref]`$e); `$e | ForEach-Object { `$_.ToString() }; exit @(`$e).Count"
            & $exe -NoProfile -NonInteractive -Command $command
            Write-Host "$exe finds $LASTEXITCODE parse errors"
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          exit $bad

      - name: Assemble and zip the kit
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'kit\dot-popper-windows-kit'
          New-Item -ItemType Directory -Force $kit | Out-Null
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/fuse" -Filter 'Dot Popper-*.zip' | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          $game = Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter 'Dot Popper.exe' | Select-Object -First 1
          Move-Item -LiteralPath $game.DirectoryName -Destination (Join-Path $kit 'Dot Popper')
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'rendered\playtest.ps1'), (Join-Path $env:RUNNER_TEMP 'rendered\README.txt') -Destination $kit
          Get-ChildItem -LiteralPath $kit | ForEach-Object { Write-Host $_.Name }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive -LiteralPath $kit -DestinationPath (Join-Path $out 'dot-popper-windows-kit.zip')
          Get-ChildItem $out | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-windows-kit
          path: ${{ runner.temp }}/out/dot-popper-windows-kit.zip
          if-no-files-found: error
          compression-level: 0

      # As a player would: Extract All in Downloads, under a folder with a
      # space, every file marked as downloaded from the internet.
      - name: Unzip the kit as a player would
        shell: pwsh
        run: |
          $place = Join-Path $env:USERPROFILE 'Downloads\dot popper kit test'
          New-Item -ItemType Directory -Force $place | Out-Null
          $zip = Join-Path $place 'dot-popper-windows-kit.zip'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'out\dot-popper-windows-kit.zip') -Destination $zip
          $mark = "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
          Expand-Archive -LiteralPath $zip -DestinationPath $place
          $kit = Join-Path $place 'dot-popper-windows-kit'
          Get-ChildItem -LiteralPath $kit -Recurse -File | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value $mark }
          "KIT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # CI only: the runner has no GPU, so Mesa's llvmpipe goes beside the
      # game in this copy, where SDL finds its opengl32.dll first.
      - name: Put Mesa's software OpenGL beside the game
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa | Out-Host
          $game = Join-Path $env:KIT 'Dot Popper'
          $bin = 'C:\msys64\ucrt64\bin'
          foreach ($pattern in 'opengl32.dll', 'libgallium_wgl.dll', 'libffi-*.dll', 'libgcc_s_seh-1.dll', 'libiconv-2.dll', 'libintl-8.dll',
              'libLLVM*.dll', 'libSPIRV-Tools*.dll', 'libstdc++-6.dll', 'libsystre-0.dll', 'libtre-5.dll', 'libwinpthread-1.dll',
              'libxml2*.dll', 'libzstd.dll', 'zlib1.dll') {
            Get-ChildItem -LiteralPath $bin -Filter $pattern | Copy-Item -Destination $game
          }

      - name: Run playtest.ps1 in Windows PowerShell 5.1, answers on standard input
        shell: cmd
        env:
          DOT_POPPER_AUTOPLAY: "1"
          DOT_POPPER_SEED: "7"
          DOT_POPPER_QUIT_AFTER: "40"
          ALSOFT_DRIVERS: "null"
          GALLIUM_DRIVER: llvmpipe
        run: |
          ruby .github\kit_check.rb answers windows "%RUNNER_TEMP%\answers.txt"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%KIT%\playtest.ps1" -NoPause < "%RUNNER_TEMP%\answers.txt"
          echo playtest.ps1 exit status %errorlevel%

      - name: Show and check dot-popper-results.txt
        run: |
          results="$KIT/dot-popper-results.txt"
          cat "$results"
          ruby .github/kit_check.rb results windows "$results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-results-windows-kit
          path: ${{ env.KIT }}/dot-popper-results*.txt
          if-no-files-found: warn

  macos:
    name: macOS arm64 app and kit
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version

      # The fuse action takes the app's version from fledge.yml; a tag's
      # build takes the tag's (playtest/kit.rb's BuildVersion), so the
      # header and lota fuse --app-version name it.
      - name: Take the version from the tag
        run: ruby script/playtest_kit.rb tag-version "$GITHUB_REF_NAME" fledge.yml

      - uses: ./.github/actions/fuse
        with:
          platform: arm64-darwin

      # With no Ruby on its PATH and an all but empty environment. The
      # runner has a window server, so the game draws; the bot plays.
      - name: Play the app by itself for 30 seconds
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/play"
          tar -xzf "$RUNNER_TEMP"/fuse/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          app=$(find "$RUNNER_TEMP/unpacked" -maxdepth 2 -name 'Dot Popper.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"
          env -i HOME="$HOME" PATH=/usr/bin:/bin ALSOFT_DRIVERS=null DOT_POPPER_AUTOPLAY=1 DOT_POPPER_SEED=7 \
            DOT_POPPER_QUIT_AFTER=30 DOT_POPPER_PERF=1 DOT_POPPER_SAVE_AS=ci-play DOT_POPPER_SHOTS=5,25 \
            "$app/Contents/MacOS/Dot Popper" > "$RUNNER_TEMP/play/out.txt" 2> "$RUNNER_TEMP/play/err.txt" &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
          if kill -0 "$pid" 2> /dev/null; then kill "$pid"; echo "::error::the app still ran after 120 s"; fi
          wait "$pid"; status=$?
          echo "exit status $status"; cat "$RUNNER_TEMP/play/out.txt"; echo "--- stderr"; cat "$RUNNER_TEMP/play/err.txt"
          cp "$HOME/Library/Application Support/ci-play/"*.png "$RUNNER_TEMP/play/" 2> /dev/null || true
          [ "$status" = 0 ]
          grep -q "a dot's radius is 50 logical pixels" "$RUNNER_TEMP/play/out.txt"
          grep -q "frames a second" "$RUNNER_TEMP/play/out.txt"

      - name: Assemble and zip the kit
        run: |
          kit=$RUNNER_TEMP/kit/dot-popper-macos-kit
          mkdir -p "$kit" "$RUNNER_TEMP/out"
          ditto "$APP" "$kit/Dot Popper.app"
          ruby script/playtest_kit.rb check-build "$GITHUB_REF_NAME" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb text playtest/README-mac.txt "$kit/README.txt" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb sheet mac "$kit/macos-results.txt" "$RUNNER_TEMP/build.txt"
          cat "$kit/macos-results.txt"
          ditto -c -k --keepParent "$kit" "$RUNNER_TEMP/out/dot-popper-macos-kit.zip"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-macos-kit
          path: ${{ runner.temp }}/out/dot-popper-macos-kit.zip
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-results-macos-play
          path: ${{ runner.temp }}/play
          if-no-files-found: warn

  linux:
    name: Linux x86_64 app and kit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OpenGL's libraries SDL opens, Mesa's software renderer, and what the
      # kit's test draws on (Xvfb) and records with (glxinfo, xrandr).
      - name: Install OpenGL, Mesa, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgl1 libegl1 libgl1-mesa-dri mesa-utils xvfb x11-xserver-utils

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version

      # The fuse action takes the app's version from fledge.yml; a tag's
      # build takes the tag's (playtest/kit.rb's BuildVersion), so the
      # header and lota fuse --app-version name it.
      - name: Take the version from the tag
        run: ruby script/playtest_kit.rb tag-version "$GITHUB_REF_NAME" fledge.yml

      - uses: ./.github/actions/fuse
        with:
          platform: x86_64-linux-gnu

      - name: Assemble the kit
        run: |
          kit=$RUNNER_TEMP/kit/dot-popper-linux-kit
          mkdir -p "$kit" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/out"
          tar -xzf "$(ls "$RUNNER_TEMP"/fuse/*.tar.gz | head -1)" -C "$RUNNER_TEMP/unpacked"
          game=$(find "$RUNNER_TEMP/unpacked" -maxdepth 3 -type f -name 'Dot Popper' -perm -u+x | head -1)
          mv "$(dirname "$game")" "$kit/Dot Popper"
          ruby script/playtest_kit.rb linux "$kit/playtest.sh" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb check-build "$GITHUB_REF_NAME" "$RUNNER_TEMP/build.txt"
          bash -n "$kit/playtest.sh"
          ruby script/playtest_kit.rb text playtest/README-linux.txt "$kit/README.txt" "$RUNNER_TEMP/build.txt"
          ls -la "$kit"
          tar -czf "$RUNNER_TEMP/out/dot-popper-linux-kit.tar.gz" -C "$RUNNER_TEMP/kit" dot-popper-linux-kit
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-linux-kit
          path: ${{ runner.temp }}/out/dot-popper-linux-kit.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Run playtest.sh under Xvfb, answers on standard input
        env:
          DOT_POPPER_AUTOPLAY: "1"
          DOT_POPPER_SEED: "7"
          DOT_POPPER_QUIT_AFTER: "40"
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          place="$RUNNER_TEMP/dot popper kit test"
          mkdir -p "$place"
          tar -xzf "$RUNNER_TEMP/out/dot-popper-linux-kit.tar.gz" -C "$place"
          echo "KIT=$place/dot-popper-linux-kit" >> "$GITHUB_ENV"
          ruby .github/kit_check.rb answers linux "$RUNNER_TEMP/answers.txt"
          xvfb-run -a -s "-screen 0 1280x800x24" "$place/dot-popper-linux-kit/playtest.sh" < "$RUNNER_TEMP/answers.txt"

      - name: Show and check dot-popper-results.txt
        run: |
          results="$KIT/dot-popper-results.txt"
          cat "$results"
          ruby .github/kit_check.rb results linux "$results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-results-linux-kit
          path: ${{ env.KIT }}/dot-popper-results*.txt
          if-no-files-found: warn

  ipad:
    name: iPad and iPhone kit (experimental)
    runs-on: macos-15
    timeout-minutes: 100
    env:
      APP_NAME: DotPopper
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version

      - name: Select the newest Xcode, and install XcodeGen and Ninja
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          brew install xcodegen ninja
          cmake --version
          xcodegen --version

      # The iOS route of Lota's doc/guide/phones.md: its source, LÖVE's and
      # love-apple-dependencies' with it, from the release's tag.
      - name: Clone Lota at v${{ env.LOTA_VERSION }}, with LÖVE's sources
        run: |
          lota=$RUNNER_TEMP/lota
          git clone --quiet --depth 1 --branch "v$LOTA_VERSION" https://github.com/setdef/Lota.git "$lota"
          git -C "$lota" submodule update --init --depth 1 vendor/love vendor/love-apple-dependencies
          echo "LOTA_SOURCE=$lota" >> "$GITHUB_ENV"
          echo "Lota v$LOTA_VERSION is $(git -C "$lota" rev-parse HEAD)"

      - name: Build SDL3 for iOS with Lota's rake ios:sdl3
        working-directory: ${{ env.LOTA_SOURCE }}
        run: |
          bundle install
          bundle exec rake ios:sdl3
          echo "RICE_DIR=$(bundle info rice --path)" >> "$GITHUB_ENV"

      # A gem named by its path carries its whole folder into the app, so
      # the project names a folder of only what Lota's gem packages.
      - name: Make a folder of Lota's packaged files
        working-directory: ${{ env.LOTA_SOURCE }}
        run: |
          mkdir -p tmp/phone
          gem build lota.gemspec --output tmp/phone/lota.gem
          gem unpack tmp/phone/lota.gem --target tmp/phone
          gem specification tmp/phone/lota.gem --ruby > tmp/phone/lota/lota.gemspec
          echo "LOTA_GEM=$LOTA_SOURCE/tmp/phone/lota" >> "$GITHUB_ENV"

      # The phone project of Lota's guide: everything in it but the hosts
      # goes into the app, so the game's copy leaves out what only the
      # repository needs. Dot Popper's ios/host (its main.m, which paints
      # the night's ink behind the game, and its Info.plist, with the
      # display name) goes over Lota's iOS host from the gem.
      - name: Lay out the phone project
        run: |
          phone=$RUNNER_TEMP/phone
          game=$phone/game/dot_popper
          mkdir -p "$game"
          git archive HEAD | tar -x -C "$game"
          (cd "$game" && rm -rf .github vendor android ios test doc playtest script sig Steepfile Rakefile \
            Gemfile Gemfile.lock mise.toml .ruby-version)
          cp -R "$LOTA_GEM/ext/lota/phone/host" "$phone/host"
          rm -rf "$phone/host/android"
          cp -R ios/host/. "$phone/host/ios/"
          cat > "$phone/main.rb" <<'EOF'
          # frozen_string_literal: true

          # Written by kits.yml: starts the game's copy as its own program does.
          load File.join(__dir__, "game", "dot_popper", "bin", "dot_popper")
          EOF
          # Lota writes NOTICES.txt for a desktop app only (lota fuse), so the
          # phone's is written from Lota's own record of what the iOS build
          # links, in Lota's format (script/phone_notices.rb). It sits at the
          # project's top, two folders above the game, where the Credits
          # screen looks (Shell::NoticeFiles). Apple's OpenAL needs no
          # notice, so there is no LGPL text or source here.
          (cd "$LOTA_SOURCE" && bundle exec ruby "$GITHUB_WORKSPACE/script/phone_notices.rb" ios "$LOTA_SOURCE" "$phone/NOTICES.txt")
          head -c 600 "$phone/NOTICES.txt"; grep -c . "$phone/NOTICES.txt"
          cat > "$phone/Gemfile" <<EOF
          # frozen_string_literal: true

          # Written by kits.yml for fledge build ios.
          source "https://rubygems.org"

          gem "lota", path: "$LOTA_GEM"
          gem "fledge", git: "https://github.com/setdef/Fledge", tag: "$FLEDGE_TAG", group: :development
          EOF
          ruby script/playtest_kit.rb tag-version "$GITHUB_REF_NAME" fledge.yml
          ruby -ryaml -e '
            source = YAML.load_file("fledge.yml")
            program = source.fetch("programs").first
            config = {
              "name" => ENV.fetch("APP_NAME"),
              "identifier" => program.fetch("identifier"),
              "version" => source.fetch("version"),
              "icon" => File.join("game/dot_popper", program.fetch("icon")),
              "ios" => { "host" => "host/ios" }
            }
            File.write(ARGV[0], "# Written by kits.yml for fledge build ios, from fledge.yml.\n" + YAML.dump(config))
          ' "$phone/fledge.yml"
          cat "$phone/Gemfile" "$phone/fledge.yml"
          version=$(ruby -ryaml -e 'print YAML.load_file("fledge.yml").fetch("version")')
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: fledge build ios
        working-directory: ${{ runner.temp }}/phone
        env:
          BUNDLE_GEMFILE: ${{ runner.temp }}/phone/Gemfile
          BUNDLE_PATH: ${{ runner.temp }}/app-bundle
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          bundle config set --local build.lota \
            "--with-lota-source=$LOTA_SOURCE --with-lota-sdl3=$LOTA_SOURCE/tmp/ios/sdl3 --with-rice-dir=$RICE_DIR"
          bundle lock --add-platform ruby
          bundle install
          bundle exec fledge --version
          time bundle exec fledge build ios
          ls -la "dist/$APP_NAME-ios"

      - name: Check the project stands on its own, and assemble the kit
        run: |
          project=$RUNNER_TEMP/phone/dist/$APP_NAME-ios
          if grep -rIl -e "$RUNNER_TEMP" -e "$GITHUB_WORKSPACE" -e /Users/runner \
              "$project/project.yml" "$project/$APP_NAME.xcodeproj" "$project/Host" "$project/fledge/fledge.cfg"; then
            echo "::error::the project names a path on this runner"; exit 1
          fi
          plutil -extract LotaAudioSessionCategory raw "$project/Host/Info.plist" | grep -qx ambient
          plutil -extract CFBundleDisplayName raw "$project/Host/Info.plist" | grep -qx "Dot Popper"
          grep -q SDL_ACCELEROMETER_AS_JOYSTICK "$project/Host/main.m"
          grep -q "0x0c / 255.0 green:0x0b / 255.0 blue:0x22" "$project/Host/main.m"
          grep -q 'TARGETED_DEVICE_FAMILY: "1,2"' "$project/project.yml"
          echo "symbolic links: $(find "$project" -type l | wc -l)"
          {
            echo "Dot Popper $GITHUB_REF_NAME, commit $GITHUB_SHA, version $APP_VERSION"
            echo "Built by fledge build ios (Fledge $FLEDGE_TAG) with Lota $LOTA_VERSION's experimental iOS engine and host, from Lota's tag v$LOTA_VERSION ($(git -C "$LOTA_SOURCE" rev-parse --short HEAD))"
            echo "Built $(date -u +%Y-%m-%d) with $(xcodebuild -version | tr '\n' ' ')on $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "Workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb check-build "$GITHUB_REF_NAME" "$RUNNER_TEMP/build.txt"
          kit=$RUNNER_TEMP/kit/dot-popper-ipad-kit
          mkdir -p "$kit"
          mv "$project" "$kit/"
          cp "$RUNNER_TEMP/build.txt" "$kit/BUILD-INFO.txt"
          echo "XcodeGen $(xcodegen --version)" >> "$kit/BUILD-INFO.txt"
          ruby script/playtest_kit.rb text playtest/README-ipad.txt "$kit/README.txt" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb sheet ios "$kit/ios-results.txt" "$RUNNER_TEMP/build.txt"
          cat "$kit/BUILD-INFO.txt" "$kit/ios-results.txt"
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$RUNNER_TEMP/kit" && zip -qry "$RUNNER_TEMP/out/dot-popper-ipad-kit.zip" dot-popper-ipad-kit)
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-ipad-kit
          path: ${{ runner.temp }}/out/dot-popper-ipad-kit.zip
          if-no-files-found: error
          compression-level: 0

  ipad-simulator:
    name: iPad kit in the Simulator
    needs: ipad
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_NAME: DotPopper
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dot-popper-ipad-kit
          path: ${{ runner.temp }}/download

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # On a runner with no Lota, Fledge, or bundle, as the maintainer's
      # Mac has none. Debug is what testers install; Release, for devices,
      # is what the App Store gets. Each app must carry the privacy
      # manifest at its top level.
      - name: Unpack the kit and build it for the Simulator and, unsigned, for devices
        run: |
          ditto -x -k "$RUNNER_TEMP/download/dot-popper-ipad-kit.zip" "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/dot-popper-ipad-kit/$APP_NAME-ios"
          mkdir -p "$RUNNER_TEMP/simulator"
          for build in Debug:iphonesimulator Debug:iphoneos Release:iphoneos; do
            configuration=${build%%:*} sdk=${build#*:}
            log=$RUNNER_TEMP/simulator/xcodebuild-$configuration-$sdk.log
            xcodebuild -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration "$configuration" -sdk "$sdk" \
              -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$log" 2>&1 \
              || { tail -80 "$log"; exit 1; }
            grep -E "BUILD" "$log" | tail -2
            manifest=$RUNNER_TEMP/derived/Build/Products/$configuration-$sdk/$APP_NAME.app/PrivacyInfo.xcprivacy
            plutil -lint "$manifest" || { echo "::error::the $configuration $sdk app has no PrivacyInfo.xcprivacy"; exit 1; }
            # Lota's notices, which Credits shows (Shell::NoticeFiles).
            app=$RUNNER_TEMP/derived/Build/Products/$configuration-$sdk/$APP_NAME.app
            find "$app" -name NOTICES.txt | tee "$RUNNER_TEMP/simulator/notices-$configuration-$sdk.txt"
            notices=$(grep -m1 . "$RUNNER_TEMP/simulator/notices-$configuration-$sdk.txt") \
              || { echo "::error::the $configuration $sdk app has no NOTICES.txt"; find "$app" -maxdepth 3 | head -40; exit 1; }
            grep -q "^FreeType " "$notices"
            grep -q "Portions of this software are copyright .* The FreeType Project" "$notices"
            grep -q "^==== AGPL-3.0-or-later ====" "$notices"
            ! grep -q "OpenAL Soft" "$notices"
          done

      # doc/ios.md, "Checking a run in the Simulator".
      - name: Run the autoplay check in an iPad Simulator
        run: |
          app=$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/$APP_NAME.app
          out=$RUNNER_TEMP/simulator
          plutil -p "$app/Info.plist" | grep -E 'UIDeviceFamily|MinimumOSVersion' -A3
          runtime=$(xcrun simctl list runtimes -j | ruby -rjson -e 'puts JSON.parse($stdin.read)["runtimes"].select { |r| r["platform"] == "iOS" && r["isAvailable"] }.max_by { |r| Gem::Version.new(r["version"]) }["identifier"]')
          device=$(xcrun simctl list devicetypes -j | ruby -rjson -e 'puts JSON.parse($stdin.read)["devicetypes"].map { |d| d["name"] }.grep(/\AiPad Pro 13-inch/).last')
          echo "runtime $runtime, device $device"
          udid=$(xcrun simctl create dot-popper-kit "$device" "$runtime")
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" "$app"
          since=$(date "+%Y-%m-%d %H:%M:%S")
          SIMCTL_CHILD_DOT_POPPER_AUTOPLAY=1 SIMCTL_CHILD_DOT_POPPER_SEED=7 \
          SIMCTL_CHILD_DOT_POPPER_QUIT_AFTER=45 SIMCTL_CHILD_DOT_POPPER_SHOTS=3,12,25,38 \
            xcrun simctl launch "$udid" "$IDENTIFIER"
          sleep 75
          xcrun simctl spawn "$udid" log show --start "$since" --info --style compact \
            --predicate "subsystem == \"$IDENTIFIER\"" > "$out/app.log" 2>&1 || true
          cat "$out/app.log"
          data=$(xcrun simctl get_app_container "$udid" "$IDENTIFIER" data)
          cp "$data/Library/Application Support/dot_popper/"* "$out/" 2>/dev/null || true
          ls -la "$out"
          grep -q "a dot's radius is 50 points" "$out/app.log"
          [ "$(grep -c 'Dot Popper: screenshot' "$out/app.log")" -ge 4 ]
          grep -q "exited with status 0" "$out/app.log"
          if grep -E "drawing without|playing without|could not (save|read)|using Lota's own font" "$out/app.log"; then
            echo "::warning::the game reported a problem in the Simulator (above)"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-results-ipad-simulator
          path: ${{ runner.temp }}/simulator
          if-no-files-found: warn

  release:
    name: Attach the kits to the release
    needs: [windows, macos, linux, ipad, ipad-simulator]
    # Every desktop kit must have passed; the iPad kit joins them when it
    # built.
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dot-popper-*-kit
          path: files
          merge-multiple: true

      - name: Attach the kits to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(files/*.zip files/*.tar.gz)
          # The Package workflow may be making the same release at once.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "${assets[@]}" && exit 0
            elif gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Dot Popper $tag" --prerelease \
                --notes "Built by the Package and Kits workflows from $GITHUB_SHA. See PACKAGING.md." "${assets[@]}"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
