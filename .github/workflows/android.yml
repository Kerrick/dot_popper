# Builds Dot Popper's EXPERIMENTAL Android kit (PACKAGING.md, "The Android
# kit"), for a phone such as a OnePlus Nord N30 5G (Android 13,
# arm64-v8a), by the route of Lota's doc/guide/phones.md at v0.3.1:
#
# 1. rake android:deps, in a clone of Lota at v0.3.1, builds LÖVE's
#    libraries and SDL3 for arm64-v8a and x86_64 with NDK r30, OpenAL Soft
#    as a shared libopenal.so and SDL3 as libSDL3.so;
# 2. the files Lota's gem packages, built and unpacked from the clone,
#    become a path gem, since Fledge carries a path gem's whole folder
#    into the app;
# 3. a phone project, laid out as the guide lays it out, holds the game in
#    game/dot_popper, the kit's program (android/android_kit) as main.rb,
#    and Lota's Android host from the gem in host/android, with Dot
#    Popper's changed files (android/host) over it, Play Billing's Gradle
#    settings among them;
# 4. fledge build android (Fledge v0.10.0) writes the Gradle project, and
#    Gradle builds the debug APK and the release App Bundle.
#
# A second job installs the kit's APK on an x86_64 emulator of API 33
# (Android 13, as on the Nord) and checks a bot's 45-second run and what
# Back does (.github/android_emulator_checks.sh). A v* tag attaches the
# kit to the tag's GitHub Release.

name: Android kit (experimental)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lota_ref:
        description: "A Lota tag or commit (full SHA) to build from, to try an engine fix"
        required: false
        default: "v0.3.1"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LOTA_REPOSITORY: https://github.com/setdef/Lota.git
  LOTA_REF: ${{ inputs.lota_ref || 'v0.3.1' }}
  NDK_REVISION: 30.0.16248370
  FLEDGE_TAG: v0.10.0
  IDENTIFIER: com.setdef.DotPopper
  APP_NAME: Dot Popper

jobs:
  build:
    name: Android APK and kit (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version

      - name: Clone Lota at ${{ env.LOTA_REF }}, with LÖVE's sources
        run: |
          lota=$RUNNER_TEMP/lota
          git init --quiet "$lota"
          git -C "$lota" remote add origin "$LOTA_REPOSITORY"
          git -C "$lota" fetch --quiet --depth 1 origin "$LOTA_REF"
          git -C "$lota" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          git -C "$lota" submodule update --init --depth 1 vendor/love
          git -C "$lota" log --oneline -1
          echo "LOTA_SOURCE=$lota" >> "$GITHUB_ENV"
          echo "LOTA_COMMIT=$(git -C "$lota" rev-parse HEAD)" >> "$GITHUB_ENV"

      # The Android SDK and NDK come from script/android_sdk.sh, pinned, as
      # on any computer; the runner gives Java 21, CMake and ccache, and
      # Ninja from apt (mise.android.toml pins the same tools elsewhere).
      - name: Use Java 21, and install ccache and Ninja
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install --assume-yes -qq ccache ninja-build > /dev/null
          cmake --version | head -1
          ninja --version
          echo "CCACHE_DIR=$HOME/.cache/lota/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lota/ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lota/tmp/android/deps
            ${{ runner.temp }}/lota/vendor/sources/android
          key: android-deps-${{ env.LOTA_COMMIT }}-${{ env.NDK_REVISION }}

      # script/android_build.sh: rake android:deps in the Lota clone (which
      # skips the build when its recipe and the NDK have not changed, as
      # with a cache from the same Lota commit), the phone project, fledge
      # build android, and Gradle's debug APK and release App Bundle.
      - name: Build the debug APK and the App Bundle with script/android_build.sh
        run: |
          time script/android_build.sh --bundle || {
            tail -80 "$LOTA_SOURCE/tmp/android/deps/build.log" tmp/android/out/*.log 2> /dev/null; exit 1; }
          echo "ANDROID_HOME=$(script/android_sdk.sh | sed -n 's/^ANDROID_HOME=//p')" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(ruby -ryaml -e 'print YAML.load_file("fledge.yml").fetch("version")')" >> "$GITHUB_ENV"
          ccache --show-stats | head -12 || true
          mkdir -p "$RUNNER_TEMP/out"
          cp tmp/android/out/DotPopper-debug.apk tmp/android/out/DotPopper-release.aab tmp/android/out/fledge.log "$RUNNER_TEMP/out/"
          cat tmp/android/phone/Gemfile tmp/android/phone/fledge.yml
          head -c 600 tmp/android/phone/NOTICES.txt; grep -c . tmp/android/phone/NOTICES.txt
          # Neither SDL's Java nor MainActivity asks Android for audio focus,
          # so the game's sound plays alongside another app's music.
          if grep -rl "requestAudioFocus" tmp/android/phone/host/android/src/main/java; then
            echo "::warning::the host's Java requests audio focus, which may stop other apps' music"
          fi

      # With the maintainer's upload key in the repository's secrets
      # (ANDROID_UPLOAD_KEYSTORE, the keystore in base64, and
      # ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD), the
      # bundle is signed for upload to Google Play, which signs the app
      # itself (Play App Signing). Without them it stays unsigned.
      - name: Sign the App Bundle for Google Play
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          aab=$RUNNER_TEMP/out/DotPopper-release.aab
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No upload key in the secrets, so the App Bundle is unsigned"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env PASSWORD -keypass:env PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          jarsigner -verify "$aab" | tail -1

      - name: Check the APK
        run: |
          tools=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          apk=$RUNNER_TEMP/out/DotPopper-debug.apk
          unzip -l "$apk" | grep -E "lib/" | tee "$RUNNER_TEMP/libs.txt"
          for abi in arm64-v8a x86_64; do
            for lib in libSDL3.so libopenal.so libfledgeruby.so libfledgeext.so; do
              grep -q "lib/$abi/$lib" "$RUNNER_TEMP/libs.txt" || { echo "::error::the APK has no lib/$abi/$lib"; exit 1; }
            done
          done
          # The notices, in the app's files (fledge.zip) with the LGPL text in
          # them and OpenAL Soft's source beside them, two folders above the game's.
          unzip -Z1 "$apk" | grep -v "^lib/" | head -40
          entry=$(unzip -Z1 "$apk" | grep -E "fledge.*\.zip$" | head -1) || { echo "::error::the APK has no fledge zip"; exit 1; }
          unzip -o -q "$apk" "$entry" -d "$RUNNER_TEMP/apk"
          bundled=$RUNNER_TEMP/apk/$entry
          unzip -Z1 "$bundled" | grep -E "(^|/)(NOTICES.txt|sources/.*)$" | tee "$RUNNER_TEMP/notices.txt"
          unzip -Z1 "$bundled" | grep -E "^[^/]*NOTICES.txt$" > /dev/null || echo "::warning::NOTICES.txt is not at the zip's top"
          unzip -p "$bundled" "$(grep -E '(^|/)NOTICES.txt$' "$RUNNER_TEMP/notices.txt" | grep -v '^notices/' | head -1)" > "$RUNNER_TEMP/NOTICES.txt"
          grep -q "sources/openal-soft-.*tar.bz2" "$RUNNER_TEMP/notices.txt"
          grep -q "^OpenAL Soft 1" "$RUNNER_TEMP/NOTICES.txt"
          grep -q "Portions of this software are copyright .* The FreeType Project" "$RUNNER_TEMP/NOTICES.txt"
          grep -q "^==== LGPL-2.0-or-later ====" "$RUNNER_TEMP/NOTICES.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" | tail -1
          "$tools/apksigner" verify --print-certs "$apk" | head -3
          "$tools/aapt2" dump badging "$apk" | grep -E "package:|[sS]dkVersion|native-code" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='$IDENTIFIER'" "$RUNNER_TEMP/badging.txt"
          grep -q "minSdkVersion:'26'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
          grep -A1 "SDL_ENV.SDL_ANDROID_TRAP_BACK_BUTTON" "$RUNNER_TEMP/manifest.txt"
          grep -q "SDL_ENV.SDL_ANDROID_TRAP_BACK_BUTTON" "$RUNNER_TEMP/manifest.txt"
          grep -q "com.android.vending.BILLING" "$RUNNER_TEMP/manifest.txt"
          grep -q "android:debuggable" "$RUNNER_TEMP/manifest.txt"

      - name: Assemble and zip the kit
        run: |
          {
            echo "Dot Popper $GITHUB_REF_NAME, commit $GITHUB_SHA, version $APP_VERSION"
            echo "EXPERIMENTAL: built by fledge build android (Fledge $FLEDGE_TAG) with Lota $LOTA_REF (${LOTA_COMMIT:0:7}), by Lota's doc/guide/phones.md"
            echo "NDK $NDK_REVISION; minSdk 26, targetSdk 36; arm64-v8a and x86_64; built $(date -u +%Y-%m-%d)"
            echo "Workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/build.txt"
          kit=$RUNNER_TEMP/kit/dot-popper-android-kit
          mkdir -p "$kit"
          cp "$RUNNER_TEMP/out/DotPopper-debug.apk" "$kit/"
          ruby script/playtest_kit.rb text playtest/README-android.txt "$kit/README.txt" "$RUNNER_TEMP/build.txt"
          ruby script/playtest_kit.rb sheet android "$kit/android-results.txt" "$RUNNER_TEMP/build.txt"
          cat "$kit/android-results.txt"
          (cd "$RUNNER_TEMP/kit" && zip -qry "$RUNNER_TEMP/out/dot-popper-android-kit.zip" dot-popper-android-kit)
          ls -la "$kit" "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-android-kit
          path: ${{ runner.temp }}/out/dot-popper-android-kit.zip
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-play-bundle
          path: ${{ runner.temp }}/out/DotPopper-release.aab
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ci-results-android-build-logs
          path: |
            ${{ runner.temp }}/lota/tmp/android/deps/build.log
            tmp/android/out/*.log
          if-no-files-found: warn
          retention-days: 14

  emulator:
    name: Android kit on an x86_64 emulator, API 33
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dot-popper-android-kit
          path: ${{ runner.temp }}/download

      - name: Unpack the kit
        run: |
          unzip -q "$RUNNER_TEMP/download/dot-popper-android-kit.zip" -d "$RUNNER_TEMP/unpacked"
          ls -la "$RUNNER_TEMP/unpacked/dot-popper-android-kit"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the kit's APK, play it with the bot, and press Back
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/android_emulator_checks.sh "${{ runner.temp }}/unpacked/dot-popper-android-kit/DotPopper-debug.apk" "${{ runner.temp }}/emulator"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-results-android-emulator
          path: ${{ runner.temp }}/emulator
          if-no-files-found: warn

  release:
    name: Attach the Android kit to the release
    needs: [build, emulator]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only a playtest release takes the kits: their fake checkout gives
      # Pro away, so a release for sale never carries them.
      - name: What the tag releases (script/release_kind.rb)
        id: kind
        run: echo "kind=$(ruby script/release_kind.rb "$GITHUB_REF_NAME")" | tee -a "$GITHUB_OUTPUT"
      - if: steps.kind.outputs.kind == 'playtest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dot-popper-android-kit
          path: files

      - if: steps.kind.outputs.kind == 'playtest'
        name: Attach the kit to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          tag="$GITHUB_REF_NAME"
          # The Package and Kits workflows may be making the same release at once.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber files/dot-popper-android-kit.zip && exit 0
            elif gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Dot Popper $tag" --prerelease \
                --notes "Built by the Package, Kits, and Android workflows from $GITHUB_SHA. See PACKAGING.md." files/dot-popper-android-kit.zip; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
