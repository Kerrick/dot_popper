# Builds Dot Popper into apps people without Ruby can run (PACKAGING.md),
# one way: `lota fuse`, with Lota 0.3.1's release gem
# (.github/actions/fuse), each on its own platform's runner. On Windows
# x64 a .zip and an installer, on macOS arm64 a .dmg and a .tar.gz, and on
# Linux x86_64 (glibc 2.39, so ubuntu-24.04) a .tar.gz and an AppImage.
# Each app then plays itself for 20 seconds with no Ruby on its PATH,
# drawing with Mesa's software OpenGL where the runner has no GPU. These
# are test builds: a playtest tag (script/release_kind.rb; today every
# v0.*) attaches them to a prerelease, and the Kits workflow builds the
# playtest kits from the same apps.
#
# The website jobs build the same three apps for sale, with the `website`
# channel set, check the apps that were built (script/check_build.rb), and
# play them. A website tag (script/release_kind.rb) releases those alone.

name: Package

on:
  push:
    branches: [trunk]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A run in progress finishes, so that frequent pushes still leave builds
# to download; only the newest waiting run is kept.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUNDLE_FROZEN: "true"
  LOTA_VERSION: "0.3.1"
  IDENTIFIER: com.setdef.DotPopper
  # The bot plays, sounds go nowhere, and the save folder is a test's own.
  PLAY_ENV: ALSOFT_DRIVERS=null DOT_POPPER_AUTOPLAY=1 DOT_POPPER_SEED=7 DOT_POPPER_QUIT_AFTER=20 DOT_POPPER_PERF=1 DOT_POPPER_SAVE_AS=ci-play

jobs:
  # What this run releases, if anything, and the version its apps must
  # have: a website tag's own number, else fledge.yml's.
  plan:
    name: What this run releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          kind=none
          if [ "$GITHUB_REF_TYPE" = tag ]; then kind=$(ruby script/release_kind.rb "$GITHUB_REF_NAME"); fi
          version=$(ruby -ryaml -e 'print YAML.load_file("fledge.yml").fetch("version")')
          if [ "$kind" = website ]; then version=${GITHUB_REF_NAME#v}; version=${version%%-*}; fi
          echo "kind=$kind" | tee -a "$GITHUB_OUTPUT"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      - run: bundle install
      - run: bundle exec rake

  privacy-document:
    name: Publish the privacy document
    needs: [test]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      - run: bundle install
      - run: script/publish_privacy_document.sh
        env:
          TAG: ${{ github.ref_name }}
          PRIVACY_DOCUMENT_TOKEN: ${{ secrets.PRIVACY_DOCUMENT_TOKEN }}

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          windows-toolchain: none
      - uses: ./.github/actions/fuse
        with:
          platform: x64-mingw-ucrt

      # Unpacked under a folder with a space, Mesa's llvmpipe beside the
      # program (SDL loads opengl32.dll from there first), and a clean
      # environment with no Ruby. Then again allowed only Vulkan, to see
      # the game get past it.
      - name: Play the unpacked app with no Ruby on its PATH
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa | Out-Host
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/fuse" -Filter 'Dot Popper-*.zip' | Select-Object -First 1
          $place = Join-Path $env:RUNNER_TEMP 'play\My Games'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $place
          $program = Get-ChildItem -LiteralPath $place -Recurse -File -Filter 'Dot Popper.exe' | Select-Object -First 1
          foreach ($pattern in 'opengl32.dll', 'libgallium_wgl.dll', 'libffi-*.dll', 'libgcc_s_seh-1.dll', 'libiconv-2.dll', 'libintl-8.dll',
              'libLLVM*.dll', 'libSPIRV-Tools*.dll', 'libstdc++-6.dll', 'libsystre-0.dll', 'libtre-5.dll', 'libwinpthread-1.dll',
              'libxml2*.dll', 'libzstd.dll', 'zlib1.dll') {
            Get-ChildItem -LiteralPath 'C:\msys64\ucrt64\bin' -Filter $pattern | Copy-Item -Destination $program.DirectoryName
          }
          $system = $env:SystemRoot
          # Runs the app with PLAY_ENV and $extra, and returns its status and output.
          function Play([hashtable] $extra) {
            $start = [Diagnostics.ProcessStartInfo]::new($program.FullName)
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.WorkingDirectory = $system
            $start.Environment.Clear()
            $variables = @{
              SystemRoot = $system; SystemDrive = $env:SystemDrive; windir = $system
              PATH = "$system\System32;$system;$system\System32\Wbem"
              USERPROFILE = $env:USERPROFILE; APPDATA = $env:APPDATA; LOCALAPPDATA = $env:LOCALAPPDATA
              TEMP = $env:RUNNER_TEMP; TMP = $env:RUNNER_TEMP; GALLIUM_DRIVER = 'llvmpipe'
            }
            foreach ($name in $variables.Keys) { $start.Environment[$name] = $variables[$name] }
            foreach ($pair in ($env:PLAY_ENV -split ' ')) { $name, $value = $pair -split '=', 2; $start.Environment[$name] = $value }
            foreach ($name in $extra.Keys) { $start.Environment[$name] = $extra[$name] }
            $process = [Diagnostics.Process]::Start($start)
            $out = $process.StandardOutput.ReadToEndAsync()
            $err = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Dot Popper.exe still ran after 120 s' }
            $process.WaitForExit()
            Write-Host "exit status: $($process.ExitCode)"
            Write-Host "--- stdout"; Write-Host $out.Result
            Write-Host "--- stderr"; Write-Host $err.Result
            [pscustomobject]@{ Status = $process.ExitCode; Out = $out.Result; Err = $err.Result }
          }
          $play = Play @{}
          if ($play.Status -ne 0) { exit 1 }
          if ($play.Out -notmatch 'frames a second') { Write-Host '::error::the game never reported drawing a frame'; exit 1 }
          if ($play.Out -notmatch "Ed25519 verifies the server's test vector") { Write-Host '::error::the packaged Ruby does not verify Ed25519'; exit 1 }

          # A PC whose Vulkan can't start the game (ADR-0007;
          # doc/design/platforms.md):
          # allowed only Vulkan, which this runner has no GPU for, the game
          # must run its own exe again without it, in a fresh save folder,
          # and play.
          Write-Host '=== Vulkan alone'
          $play = Play @{ DOT_POPPER_RENDERERS = 'vulkan'; DOT_POPPER_SAVE_AS = 'ci-vulkan' }
          if ($play.Status -ne 0) { exit 1 }
          if ($play.Err -notmatch 'starts again without Vulkan') { Write-Host '::error::the game never started again without Vulkan'; exit 1 }
          if ($play.Out -notmatch 'renderer OpenGL') { Write-Host '::error::the game started again, but not with OpenGL'; exit 1 }
          if ($play.Out -notmatch 'frames a second') { Write-Host '::error::the game never reported drawing a frame without Vulkan'; exit 1 }
          if (-not (Test-Path -LiteralPath "$env:APPDATA\ci-vulkan\vulkan_failed.txt")) { Write-Host '::error::no note that Vulkan failed'; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-windows-x64
          path: |
            ${{ runner.temp }}/fuse/*.zip
            ${{ runner.temp }}/fuse/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  # The Windows build as an MSIX for the Microsoft Store (doc/publishing.md).
  # The Store signs the package itself, so the artifact is unsigned. To check
  # it, a copy is signed with a throwaway certificate whose subject is the
  # Publisher, trusted on this runner, installed, played and removed.
  # The Microsoft Store's own build: its channel set before fusing
  # (script/set_build_channel.rb), so it sells Pro through the Store, by
  # the store helper (windows/store) beside the program.
  msix:
    name: Windows MSIX (Microsoft Store build)
    needs: [plan, test]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Placeholders until the maintainer copies them from Partner Center.
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'setdef.DotPopper' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Dot Popper test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          windows-toolchain: none
      - run: ruby script/set_build_channel.rb microsoft-store
      - uses: ./.github/actions/fuse
        with:
          platform: x64-mingw-ucrt

      - name: Build the store helper with MinGW, and check it
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc | Out-Host
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $helper = Join-Path $env:RUNNER_TEMP 'helper'
          New-Item -ItemType Directory -Force -Path $helper | Out-Null
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-cast-function-type -municode -static `
            -o "$helper\dot-popper-store.exe" windows/store/dot_popper_store.c -lruntimeobject -lole32
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$helper\dot-popper-store.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Lay out the package and write its manifest
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/fuse" -Filter 'Dot Popper-*.zip' | Select-Object -First 1
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unzipped
          $program = Get-ChildItem -LiteralPath $unzipped -Recurse -File -Filter 'Dot Popper.exe' | Select-Object -First 1
          $root = $program.DirectoryName
          # The store helper beside the program, where Shell::StoreHelper
          # looks; started by the game, it has the package's identity.
          Copy-Item (Join-Path $env:RUNNER_TEMP 'helper\dot-popper-store.exe') $root

          # The runner has no GPU: Mesa's software OpenGL goes beside the
          # program for the check below. (The Store build is this folder
          # too; a player's GPU driver takes over from opengl32.dll's own.)
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa | Out-Host
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          New-Item -ItemType Directory -Force -Path $mesa | Out-Null
          foreach ($pattern in 'opengl32.dll', 'libgallium_wgl.dll', 'libffi-*.dll', 'libgcc_s_seh-1.dll', 'libiconv-2.dll', 'libintl-8.dll',
              'libLLVM*.dll', 'libSPIRV-Tools*.dll', 'libstdc++-6.dll', 'libsystre-0.dll', 'libtre-5.dll', 'libwinpthread-1.dll',
              'libxml2*.dll', 'libzstd.dll', 'zlib1.dll') {
            Get-ChildItem -LiteralPath 'C:\msys64\ucrt64\bin' -Filter $pattern | Copy-Item -Destination $mesa
          }

          # A tag names the version; otherwise fledge.yml does. Always X.Y.Z.0.
          $name = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Select-String -Path fledge.yml -Pattern '^version:\s*"?([0-9.]+)').Matches[0].Groups[1].Value }
          $parts = @($name.Split('.')[0..2])
          $version = ($parts -join '.') + '.0'
          Write-Host "version $version"

          # Logos from the repo's icon, at the sizes the manifest names.
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "$root\Assets" | Out-Null
          $logos = @{ 'Square44x44Logo.png' = 44; 'Square150x150Logo.png' = 150; 'StoreLogo.png' = 50 }
          foreach ($file in $logos.Keys) {
            $size = $logos[$file]
            $source = [Drawing.Image]::FromFile((Resolve-Path 'icons/icon-256.png'))
            $bitmap = [Drawing.Bitmap]::new($size, $size)
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = 'HighQualityBicubic'
            $graphics.DrawImage($source, 0, 0, $size, $size)
            $bitmap.Save("$root\Assets\$file", [Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose(); $source.Dispose()
          }

          $manifest = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"'
            '         xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"'
            '         xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"'
            '         IgnorableNamespaces="uap rescap">'
            "  <Identity Name=`"$env:MSIX_IDENTITY_NAME`" Publisher=`"$env:MSIX_PUBLISHER`" Version=`"$version`" ProcessorArchitecture=`"x64`" />"
            '  <Properties>'
            '    <DisplayName>Dot Popper</DisplayName>'
            '    <PublisherDisplayName>setdef</PublisherDisplayName>'
            '    <Logo>Assets\StoreLogo.png</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />'
            '  </Dependencies>'
            '  <Resources>'
            '    <Resource Language="en-us" />'
            '  </Resources>'
            '  <Applications>'
            "    <Application Id=`"App`" Executable=`"$($program.Name)`" EntryPoint=`"Windows.FullTrustApplication`">"
            '      <uap:VisualElements DisplayName="Dot Popper" Description="A small arcade game about popping dots." BackgroundColor="#1D1A4A"'
            '                          Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />'
            '    </Application>'
            '  </Applications>'
            '  <Capabilities>'
            '    <rescap:Capability Name="runFullTrust" />'
            '  </Capabilities>'
            '</Package>'
          ) -join "`n"
          [IO.File]::WriteAllText("$root\AppxManifest.xml", $manifest, [Text.UTF8Encoding]::new($false))

          # The unsigned package is the Store's; the check below signs a copy.
          # It is packed from a folder without Mesa (a player's GPU does the
          # drawing); the check's copy is packed again with it.
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $makeappx.FullName pack /d $root /p "$out\Dot-Popper-$version.msix" /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$mesa\*" $root
          & $makeappx.FullName pack /d $root /p "$env:RUNNER_TEMP\check.msix" /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "SIGNTOOL=$(Join-Path $makeappx.DirectoryName 'signtool.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $out

      - name: Check the app that was built
        run: ruby script/check_build.rb microsoft-store "${{ needs.plan.outputs.version }}" "$RUNNER_TEMP/unzipped"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-msix
          path: ${{ runner.temp }}/msix/*.msix
          if-no-files-found: error
          compression-level: 0

      - name: Sign a copy with a throwaway certificate, install it and play it
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'check.msix'
          $password = ConvertTo-SecureString -String 'throwaway' -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature -FriendlyName 'Dot Popper CI' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'throwaway.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'throwaway.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p throwaway $signed
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME
          if (-not $package) { throw 'the package did not install' }
          $family = $package.PackageFamilyName
          Write-Host "installed $($package.PackageFullName), family $family, at $($package.InstallLocation)"

          # An app started through its AUMID does not inherit this shell's
          # variables, so they go in the user's environment, which Explorer
          # reloads when told the environment changed.
          $variables = @{ ALSOFT_DRIVERS = 'null'; DOT_POPPER_AUTOPLAY = '1'; DOT_POPPER_SEED = '7'; DOT_POPPER_QUIT_AFTER = '90'; DOT_POPPER_PERF = '1'; GALLIUM_DRIVER = 'llvmpipe' }
          foreach ($name in $variables.Keys) { [Environment]::SetEnvironmentVariable($name, $variables[$name], 'User') }
          Start-Sleep -Seconds 3

          Start-Process explorer.exe "shell:AppsFolder\$family!App"
          $started = $null
          for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep -Seconds 1; $started = Get-Process -Name 'Dot Popper' -ErrorAction SilentlyContinue }
          if (-not $started) { throw 'Dot Popper never started from its AUMID' }
          Write-Host "started after $i s"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $started | ForEach-Object { $_.WaitForExit(240000) | Out-Null }
          $left = Get-Process -Name 'Dot Popper' -ErrorAction SilentlyContinue
          Write-Host "ran $([int]$watch.Elapsed.TotalSeconds) s more; still running: $([bool]$left)"
          if ($left) { $left | Stop-Process -Force; Write-Host '::error::it did not quit by itself, so DOT_POPPER_QUIT_AFTER did not reach it' }

          # The game saves only when a game ends, and the autopilot's first
          # game runs past half a minute, hence 90 s of game time. Inside
          # the package, Windows redirects roaming AppData to the package's
          # LocalCache; the saves must land there or in the real one.
          $data = Join-Path $env:LOCALAPPDATA "Packages\$family"
          $saves = @(Get-ChildItem -LiteralPath $data, $env:APPDATA -Recurse -Force -File -ErrorAction SilentlyContinue -Filter 'games.csv')
          $saves | ForEach-Object { Write-Host "saved: $($_.FullName)" }
          if (-not $saves) { Write-Host '::error::no games.csv was saved anywhere'; $left = $true }
          Remove-AppxPackage -Package $package.PackageFullName
          foreach ($name in $variables.Keys) { [Environment]::SetEnvironmentVariable($name, $null, 'User') }
          if ($left) { exit 1 }

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      - uses: ./.github/actions/fuse
        with:
          platform: arm64-darwin

      - name: Play the unpacked app with no Ruby on its PATH
        run: |
          mkdir -p "$RUNNER_TEMP/play/My Games"
          tar -xzf "$RUNNER_TEMP"/fuse/*.tar.gz -C "$RUNNER_TEMP/play/My Games"
          app=$(find "$RUNNER_TEMP/play" -maxdepth 3 -name 'Dot Popper.app' -type d | head -1)
          # shellcheck disable=SC2086
          env -i HOME="$HOME" PATH=/usr/bin:/bin $PLAY_ENV "$app/Contents/MacOS/Dot Popper" > "$RUNNER_TEMP/play/out.txt" 2>&1 &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
          if kill -0 "$pid" 2> /dev/null; then kill "$pid"; echo "::error::the app still ran after 120 s"; fi
          wait "$pid"; status=$?
          echo "exit status $status"; cat "$RUNNER_TEMP/play/out.txt"
          [ "$status" = 0 ] && grep -q "frames a second" "$RUNNER_TEMP/play/out.txt" \
            && grep -q "Ed25519 verifies the server's test vector" "$RUNNER_TEMP/play/out.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-macos-arm64
          path: |
            ${{ runner.temp }}/fuse/*.dmg
            ${{ runner.temp }}/fuse/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The Mac App Store's own build (doc/publishing.md): its channel set
  # before fusing, the store helper (macos/store) in Contents/Helpers, and
  # the App Sandbox. Signed here ad hoc only, to check that it starts and
  # plays inside the sandbox; the maintainer's Apple Distribution identity
  # and provisioning profile sign the real one. Its artifact is not
  # attached to a playtest release.
  mac-app-store:
    name: Mac App Store build
    needs: [plan, test]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      - run: ruby script/set_build_channel.rb mac-app-store
      - uses: ./.github/actions/fuse
        with:
          platform: arm64-darwin

      - name: Build the store helper, put it in the app, and sign both for the sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/mas"
          tar -xzf "$RUNNER_TEMP"/fuse/*.tar.gz -C "$RUNNER_TEMP/mas"
          app=$(find "$RUNNER_TEMP/mas" -maxdepth 3 -name 'Dot Popper.app' -type d | head -1)
          echo "MAS_APP=$app" >> "$GITHUB_ENV"
          mkdir -p "$app/Contents/Helpers"
          helper="$app/Contents/Helpers/dot-popper-store"
          xcrun swiftc -O -target arm64-apple-macos13 \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker macos/store/Info.plist \
            -o "$helper" macos/store/main.swift
          "$helper" --check
          # Inside out, and never --deep: the helper, then the app.
          codesign --force --sign - --identifier com.setdef.DotPopper.store-helper \
            --entitlements macos/store/helper.entitlements "$helper"
          codesign --force --sign - --entitlements macos/store/app.entitlements "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          codesign --display --entitlements - "$helper"

      - name: Check the app that was built
        run: ruby script/check_build.rb mac-app-store "${{ needs.plan.outputs.version }}" "$RUNNER_TEMP/mas"

      - name: Play the sandboxed app
        run: |
          out="$RUNNER_TEMP/mas-play.txt"
          # shellcheck disable=SC2086
          env -i HOME="$HOME" PATH=/usr/bin:/bin $PLAY_ENV "$MAS_APP/Contents/MacOS/Dot Popper" > "$out" 2>&1 &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
          if kill -0 "$pid" 2> /dev/null; then kill "$pid"; echo "::error::the app still ran after 120 s"; fi
          wait "$pid"; status=$?
          echo "exit status $status"; cat "$out"
          # A sandboxed app saves inside its container.
          ls -la "$HOME/Library/Containers/com.setdef.DotPopper/Data/Library/Application Support/" || true
          [ "$status" = 0 ] && grep -q "frames a second" "$out"

      - name: Package it for the store, unsigned
        run: |
          mkdir -p "$RUNNER_TEMP/mas-pkg"
          productbuild --component "$MAS_APP" /Applications "$RUNNER_TEMP/mas-pkg/Dot-Popper-$APP_VERSION-mac-app-store-unsigned.pkg"
          ls -la "$RUNNER_TEMP/mas-pkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-store-unsigned
          path: ${{ runner.temp }}/mas-pkg/*.pkg
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenGL, Mesa, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgl1 libegl1 libgl1-mesa-dri xvfb
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      - uses: ./.github/actions/fuse
        with:
          platform: x86_64-linux-gnu

      - name: Play the unpacked app with no Ruby on its PATH, under Xvfb
        run: |
          mkdir -p "$RUNNER_TEMP/play/My Games"
          tar -xzf "$(ls "$RUNNER_TEMP"/fuse/*.tar.gz | head -1)" -C "$RUNNER_TEMP/play/My Games"
          program=$(find "$RUNNER_TEMP/play" -maxdepth 4 -type f -name 'Dot Popper' -perm -u+x | head -1)
          set +e
          # DISPLAY and XAUTHORITY are Xvfb's, which only the inner shell
          # knows.
          # shellcheck disable=SC2016
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c \
            'exec env -i HOME="$HOME" PATH=/usr/bin:/bin DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" LIBGL_ALWAYS_SOFTWARE=1 $PLAY_ENV timeout 120 "$0"' \
            "$program" > "$RUNNER_TEMP/play/out.txt" 2>&1
          status=$?
          set -e
          echo "exit status $status"; cat "$RUNNER_TEMP/play/out.txt"
          [ "$status" = 0 ] && grep -q "frames a second" "$RUNNER_TEMP/play/out.txt" \
            && grep -q "Ed25519 verifies the server's test vector" "$RUNNER_TEMP/play/out.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-popper-linux-x86_64
          path: |
            ${{ runner.temp }}/fuse/*.tar.gz
            ${{ runner.temp }}/fuse/*.AppImage
          if-no-files-found: error
          compression-level: 0

  # The apps for sale outside the stores (doc/publishing.md, The website
  # channel): each desktop system's app with the `website` channel set
  # before fusing, so it sells Pro through the browser checkout and trusts
  # only setdef's keys. Each file it makes is unpacked and checked as built
  # (script/check_build.rb), and the app plays itself as the test builds
  # do: the bot makes it an automated run, which reaches no outside host.
  # Uploaded as website-<system>, never with the test builds.
  website:
    name: Website build, ${{ matrix.name }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest, platform: x64-mingw-ucrt, system: windows-x64 }
          - { name: macOS arm64, runner: macos-15, platform: arm64-darwin, system: macos-arm64 }
          - { name: Linux x86_64, runner: ubuntu-24.04, platform: x86_64-linux-gnu, system: linux-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenGL, Mesa, and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgl1 libegl1 libgl1-mesa-dri xvfb
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          windows-toolchain: none
      - run: ruby script/set_build_channel.rb website
      - uses: ./.github/actions/fuse
        with:
          platform: ${{ matrix.platform }}

      # Every file the release would offer, each unpacked on its own.
      - name: Check each file's app as it was built
        run: |
          temp=$RUNNER_TEMP
          # One spelling of the folder that both Git's bash and Ruby read.
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -m "$RUNNER_TEMP"); fi
          fuse="$temp/fuse"
          check() { ruby script/check_build.rb website "$VERSION" "$1"; }
          case "$RUNNER_OS" in
            Windows)
              7z x -y -bd -o"$temp/zip" "$fuse"/*.zip > /dev/null
              check "$temp/zip"
              7z x -y -bd -o"$temp/installer" "$fuse"/*-setup.exe > /dev/null
              check "$temp/installer" ;;
            macOS)
              mkdir -p "$temp/tar"
              tar -xzf "$fuse"/*.tar.gz -C "$temp/tar"
              check "$temp/tar"
              hdiutil attach -nobrowse -readonly -mountpoint "$temp/dmg" "$fuse"/*.dmg
              status=0; check "$temp/dmg" || status=$?
              hdiutil detach "$temp/dmg"
              exit "$status" ;;
            Linux)
              mkdir -p "$temp/tar" "$temp/appimage"
              tar -xzf "$fuse"/*.tar.gz -C "$temp/tar"
              check "$temp/tar"
              cp "$fuse"/*.AppImage "$temp/appimage/app.AppImage"
              chmod +x "$temp/appimage/app.AppImage"
              (cd "$temp/appimage" && ./app.AppImage --appimage-extract > /dev/null)
              check "$temp/appimage/squashfs-root" ;;
          esac

      - name: Play the unpacked app with no Ruby on its PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa | Out-Host
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/fuse" -Filter 'Dot Popper-*.zip' | Select-Object -First 1
          $place = Join-Path $env:RUNNER_TEMP 'play\My Games'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $place
          $program = Get-ChildItem -LiteralPath $place -Recurse -File -Filter 'Dot Popper.exe' | Select-Object -First 1
          foreach ($pattern in 'opengl32.dll', 'libgallium_wgl.dll', 'libffi-*.dll', 'libgcc_s_seh-1.dll', 'libiconv-2.dll', 'libintl-8.dll',
              'libLLVM*.dll', 'libSPIRV-Tools*.dll', 'libstdc++-6.dll', 'libsystre-0.dll', 'libtre-5.dll', 'libwinpthread-1.dll',
              'libxml2*.dll', 'libzstd.dll', 'zlib1.dll') {
            Get-ChildItem -LiteralPath 'C:\msys64\ucrt64\bin' -Filter $pattern | Copy-Item -Destination $program.DirectoryName
          }
          $system = $env:SystemRoot
          $start = [Diagnostics.ProcessStartInfo]::new($program.FullName)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.WorkingDirectory = $system
          $start.Environment.Clear()
          $variables = @{
            SystemRoot = $system; SystemDrive = $env:SystemDrive; windir = $system
            PATH = "$system\System32;$system;$system\System32\Wbem"
            USERPROFILE = $env:USERPROFILE; APPDATA = $env:APPDATA; LOCALAPPDATA = $env:LOCALAPPDATA
            TEMP = $env:RUNNER_TEMP; TMP = $env:RUNNER_TEMP; GALLIUM_DRIVER = 'llvmpipe'
          }
          foreach ($name in $variables.Keys) { $start.Environment[$name] = $variables[$name] }
          foreach ($pair in ($env:PLAY_ENV -split ' ')) { $name, $value = $pair -split '=', 2; $start.Environment[$name] = $value }
          $process = [Diagnostics.Process]::Start($start)
          $out = $process.StandardOutput.ReadToEndAsync()
          $err = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Dot Popper.exe still ran after 120 s' }
          $process.WaitForExit()
          Write-Host "exit status: $($process.ExitCode)"
          Write-Host "--- stdout"; Write-Host $out.Result
          Write-Host "--- stderr"; Write-Host $err.Result
          if ($process.ExitCode -ne 0) { exit 1 }
          if ($out.Result -notmatch 'frames a second') { Write-Host '::error::the game never reported drawing a frame'; exit 1 }
          if ($out.Result -notmatch "Ed25519 verifies the server's test vector") { Write-Host '::error::the packaged Ruby does not verify Ed25519'; exit 1 }

      - name: Play the unpacked app with no Ruby on its PATH
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/play/My Games"
          tar -xzf "$RUNNER_TEMP"/fuse/*.tar.gz -C "$RUNNER_TEMP/play/My Games"
          app=$(find "$RUNNER_TEMP/play" -maxdepth 3 -name 'Dot Popper.app' -type d | head -1)
          # shellcheck disable=SC2086
          env -i HOME="$HOME" PATH=/usr/bin:/bin $PLAY_ENV "$app/Contents/MacOS/Dot Popper" > "$RUNNER_TEMP/play/out.txt" 2>&1 &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
          if kill -0 "$pid" 2> /dev/null; then kill "$pid"; echo "::error::the app still ran after 120 s"; fi
          wait "$pid"; status=$?
          echo "exit status $status"; cat "$RUNNER_TEMP/play/out.txt"
          [ "$status" = 0 ] && grep -q "frames a second" "$RUNNER_TEMP/play/out.txt" \
            && grep -q "Ed25519 verifies the server's test vector" "$RUNNER_TEMP/play/out.txt"

      - name: Play the unpacked app with no Ruby on its PATH, under Xvfb
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/play/My Games"
          tar -xzf "$(ls "$RUNNER_TEMP"/fuse/*.tar.gz | head -1)" -C "$RUNNER_TEMP/play/My Games"
          program=$(find "$RUNNER_TEMP/play" -maxdepth 4 -type f -name 'Dot Popper' -perm -u+x | head -1)
          set +e
          # shellcheck disable=SC2016
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c \
            'exec env -i HOME="$HOME" PATH=/usr/bin:/bin DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" LIBGL_ALWAYS_SOFTWARE=1 $PLAY_ENV timeout 120 "$0"' \
            "$program" > "$RUNNER_TEMP/play/out.txt" 2>&1
          status=$?
          set -e
          echo "exit status $status"; cat "$RUNNER_TEMP/play/out.txt"
          [ "$status" = 0 ] && grep -q "frames a second" "$RUNNER_TEMP/play/out.txt" \
            && grep -q "Ed25519 verifies the server's test vector" "$RUNNER_TEMP/play/out.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/fuse/*.zip
            ${{ runner.temp }}/fuse/*-setup.exe
            ${{ runner.temp }}/fuse/*.dmg
            ${{ runner.temp }}/fuse/*.tar.gz
            ${{ runner.temp }}/fuse/*.AppImage
          if-no-files-found: error
          compression-level: 0

  # A website tag's release (script/release_kind.rb): the website builds
  # alone, as an ordinary release, or a prerelease for a tag with a
  # suffix. No test build or kit is attached: their fake checkout gives Pro
  # away. Every website job must have passed.
  website-release:
    name: Release the website builds
    needs: [plan, test, website]
    if: ${{ needs.plan.outputs.kind == 'website' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: website-*
          path: artifacts
          merge-multiple: true
      - name: Make the tag's release with the website builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la artifacts
          for file in 'Dot Popper-x64-mingw-ucrt.zip' 'Dot Popper-x64-mingw-ucrt-setup.exe' 'Dot Popper-arm64-darwin.dmg' \
              'Dot Popper-arm64-darwin.tar.gz' 'Dot Popper-x86_64-linux.tar.gz' 'Dot Popper-x86_64-linux.AppImage'; do
            [ -f "artifacts/$file" ] || { echo "::error::$file is missing"; exit 1; }
          done
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$tag already has a release; a website release carries the website builds alone, so delete that one first"
            exit 1
          fi
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Dot Popper $VERSION" "${prerelease[@]}" \
            --notes "Dot Popper $VERSION for Windows, macOS and Linux. Built by the Package workflow from $GITHUB_SHA." artifacts/*

  # A playtest tag's prerelease: the test builds (and the MSIX), whose
  # fake checkout gives Pro away, beside the Kits workflow's kits.
  release:
    name: Release
    needs: [plan, test, windows, msix, macos, linux]
    if: ${{ always() && needs.plan.outputs.kind == 'playtest' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dot-popper-*
          path: artifacts
          merge-multiple: true
      - name: Attach the builds to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          tag="$GITHUB_REF_NAME"
          # The Kits workflow may be making the same release at once.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber artifacts/* && exit 0
            elif gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Dot Popper $tag" --prerelease \
                --notes "Built by the Package and Kits workflows from $GITHUB_SHA. See PACKAGING.md." artifacts/*; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
