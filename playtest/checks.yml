# The hand checks of Dot Popper's playtest kits (PACKAGING.md, "Playtest
# kits"), and the only place their words live. script/playtest_kit.rb
# renders them into each kit: the desktop list into the Windows kit's
# playtest.ps1 and the Linux kit's playtest.sh, which ask them one at a
# time while the game runs, and into the macOS kit's macos-results.txt;
# the iPad list into the iPad kit's ipad-results.txt. The results sheets
# are filled in by hand. test/playtest_kit_test.rb checks that every check
# has wording on every system, and that each phrase in +quotes+ is one the
# game shows (Presentation::Look), so a question never names a button by a
# word the game no longer uses.
#
# Each check has:
#   id       its number, which the results name it by
#   ask      what the player answers, as a statement to agree with or a
#            question, in the game's own words
#   answer   the kind of answer (left out when +parts+ holds them all):
#            yes_no (y / n / skip), yes_no_not_shown (also "not shown"),
#            rating (1 to 5, with +scale+), choice (one of +options+),
#            paste (y / n, then the pasted text), or describe (free text)
# and may have:
#   try      what to do before answering, shown first
#   restart  true when the kit waits for the player to quit the game and
#            starts it again before asking (a sheet asks the player to)
#   after    what to do once it is answered
#   group    controller, for checks asked only of a player with one
#   parts    further answers the check asks for, each with ask and answer
#   quotes   the phrases of +ask+ (or +try+) that the game itself shows
#
# A desktop check's try, ask, and after may differ by system: a mapping
# of windows, mac, and linux to their words, with default for the rest.
#
# Desktop checks are written with a mouse's words ("Click"), the iPad's
# with a touch screen's ("Tap"). Windows wording stays in ASCII, since
# Windows PowerShell 5.1 reads a script without a byte order mark as ANSI.

desktop:
  - id: 1
    try: Play a round. Click a few bright dots, and listen.
    ask: Sound plays through your speakers or headphones.
    answer: yes_no

  - id: 2
    try:
      default: >-
        Go back to the title screen. Press M, or click the speaker icon in its
        corner, so the sound is off. Then quit Dot Popper with Escape on the
        title screen. The kit starts it again by itself.
      mac: >-
        Go back to the title screen. Press M, or click the speaker icon in its
        corner, so the sound is off. Then quit Dot Popper with Escape on the
        title screen, and open it again.
    restart: true
    ask: The sound is still off after quitting and starting again (the speaker icon still shows it off, and pops are silent).
    answer: yes_no
    after: Now press M again to turn the sound back on, for the checks that follow.

  - id: 3
    try: In a round, wait for the bright dot to come near each edge of the window (top, bottom, left and right), and click it there.
    ask: Clicking a bright dot near each edge pops it.
    answer: yes_no

  - id: 4
    try:
      default: Press F11, then F11 again. Then press Alt+Enter, then Alt+Enter again.
      mac: Press Command+Enter, then Command+Enter again.
    ask:
      default: F11 and Alt+Enter each switch fullscreen on and off, and the dots stay on screen each time.
      mac: Command+Enter switches fullscreen on and off, and the dots stay on screen each time.
    answer: yes_no

  - id: 5
    try:
      default: In the middle of a round, drag an edge or corner of the window to make it much smaller, then much bigger.
      windows: >-
        In the middle of a round, drag an edge or corner of the window to make it
        much smaller, then much bigger. (Windows pauses the game while you drag
        the window's edge. That is expected.)
    ask: Resizing the window mid-round keeps every dot on screen.
    answer: yes_no

  - id: 6
    try: With headphones or stereo speakers, pop a dot near the left edge, then one near the right edge.
    ask: Pops pan left and right, so a pop on the left sounds from the left and one on the right from the right.
    answer: yes_no

  - id: 7
    ask: The bright dot's edge is easy to see while it moves.
    answer: yes_no

  - id: 8
    try: >-
      After a round, look at the title screen for a "Dot size" choice. If it
      is there, click its second option ("Bigger, less room" or "Smaller, more
      room"), then play a round.
    ask: >-
      Picking the second option changes the size of the drifting dots on the
      title, and the next round's dots match. If the title shows no "Dot size"
      choice, answer ns, for not shown.
    answer: yes_no_not_shown
    quotes: [Dot size, "Bigger, less room", "Smaller, more room"]

  - id: 9
    try:
      windows: On the Game Over screen, click "Copy my result". Then open Notepad and paste (Ctrl+V).
      mac: On the Game Over screen, click "Copy my result". Then open TextEdit and paste (Command+V).
      linux: On the Game Over screen, click "Copy my result". Then open a text editor and paste (Ctrl+V).
    ask: The pasted result reads sensibly.
    answer: paste
    quotes: [Copy my result]

  - id: 10
    try: On the title screen, click "Your records" in the bottom left corner. Then click anywhere.
    ask: '"Your records" opens your records, and "Click anywhere to go back" takes you back to the title.'
    answer: yes_no
    quotes: [Your records, Click anywhere to go back]

  - id: 11
    ask: Text looks sharp, not blurry, at your display scale.
    answer: yes_no

  - id: 12
    try: >-
      On the Game Over screen, hold the mouse button down on a dot in the pile,
      drag it, and let go. Then, on another Game Over, click once without
      dragging.
    ask: Holding and dragging a pile dot throws it, and a plain click ("Click to continue") goes to the title.
    answer: yes_no
    quotes: [Click to continue]

  - id: 13
    ask: Overall, how does Dot Popper feel to play?
    answer: rating
    scale: 1 (not fun) to 5 (great)

  - id: 14
    group: controller
    try:
      default: Press F11 for fullscreen. Push the controller's left stick all the way, across the whole screen, and back. Then move the mouse.
      mac: Press Command+Enter for fullscreen. Push the controller's left stick all the way, across the whole screen, and back. Then move the mouse.
    ask: The cursor moves smoothly at full speed across the fullscreen window, and moving the mouse hides it.
    answer: yes_no
    parts:
      - ask: "The cursor's top speed:"
        answer: rating
        scale: 1 (much too slow), 3 (right), 5 (much too fast)

  - id: 15
    group: controller
    ask: A pops the bright dot under the cursor.
    answer: yes_no

  - id: 16
    group: controller
    ask: Start starts a round from the title screen, and continues after Game Over.
    answer: yes_no

  - id: 17
    group: controller
    try: On the title screen, press X. Then press B.
    ask: X opens "Your records", and B goes back to the title (the screen says "Press B to go back").
    answer: yes_no
    quotes: [Your records, Press B to go back]

  - id: 18
    group: controller
    try: On the Game Over screen, hold A with the cursor on a pile dot, move the cursor, and let go. Then push the right stick about.
    ask: Holding A on a pile dot drags it, and the right stick rolls the pile.
    answer: yes_no

ipad:
  - id: 1
    try: Open Dot Popper from the Home Screen. Turn the iPad to portrait, then to landscape.
    ask: The game fills the screen with no status bar, in portrait and in landscape.
    answer: yes_no

  - id: 2
    ask: A tap pops a bright dot right where your finger is.
    answer: yes_no

  - id: 3
    try: In a round, tap a popped (dark) dot on purpose, ideally one with the bright dot hiding under it. The title calls this "Tap a popped dot".
    ask: Tapping a popped dot costs 2 points and 2 seconds, and a dashed outline shows the bright dot it hid.
    answer: yes_no
    quotes: [Tap a popped dot]

  - id: 4
    ask: "How big a dot feels under your finger:"
    answer: choice
    options: [too small, right, too big]

  - id: 5
    try: Start some music in another app (Music, Spotify, a podcast), then switch to Dot Popper and pop a few dots. Then turn on Silent Mode (the switch on the side, or Control Center).
    ask: "The game's sound:"
    parts:
      - ask: plays at all
        answer: yes_no
      - ask: mixes with the music from the other app, which keeps playing
        answer: yes_no
      - ask: goes quiet in Silent Mode
        answer: yes_no

  - id: 6
    ask: Rotating the iPad in the middle of a round keeps every dot on screen.
    answer: yes_no

  - id: 7
    try: On the Game Over screen, tilt the iPad one way and another, then give it a short shake.
    ask: Tilting at Game Over rolls the dots toward the lowest edge. (If they roll the wrong way, say in the note how you held the iPad.)
    answer: yes_no
    parts:
      - ask: A shake tosses them up.
        answer: yes_no

  - id: 8
    try: On the Game Over screen, drag a dot in the pile with your finger, and let go while moving. Then, on another Game Over, tap once without dragging.
    ask: Dragging a pile dot with a finger throws it, and a tap ("Tap to continue") goes to the title.
    answer: yes_no
    quotes: [Tap to continue]

  - id: 9
    try: After a round, look at the title screen for a "Dot size" choice. If it is there, tap its second option ("Smaller, more room" or "Bigger, less room"), then play a round.
    ask: The Dot size choice changes the next round's dots. If the title shows no "Dot size" choice, write "not shown".
    answer: yes_no_not_shown
    quotes: [Dot size, "Smaller, more room", "Bigger, less room"]

  - id: 10
    try: On the Game Over screen, tap "Copy my result". Then open Notes and paste.
    ask: The pasted result reads sensibly.
    answer: paste
    quotes: [Copy my result]

  - id: 11
    group: controller
    try: Pair the Xbox controller in Settings > Bluetooth (hold its pairing button until the Xbox logo flashes fast), then play with it. Skip this check without a controller.
    ask: "With the Xbox controller paired:"
    parts:
      - ask: the left stick moves a cursor
        answer: yes_no
      - ask: A pops the bright dot under the cursor
        answer: yes_no
      - ask: Start starts a round
        answer: yes_no
      - ask: holding A on a pile dot at Game Over drags it
        answer: yes_no
      - ask: the right stick rolls the pile
        answer: yes_no

  - id: 12
    ask: Did anything crash, freeze, or look wrong? Describe it, and take a screenshot (press the top button and a volume button together) to send along.
    answer: describe

  - id: 13
    ask: Overall, how does Dot Popper feel to play?
    answer: rating
    scale: 1 (not fun) to 5 (great)
    parts:
      - ask: Your wife's first impression, in her own words
        answer: describe
