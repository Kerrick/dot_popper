# The hand checks of Dot Popper's playtest kits (PACKAGING.md, "Playtest
# kits"), and the only place their words live. script/playtest_kit.rb
# renders them into each kit: the desktop list into the Windows kit's
# playtest.ps1 and the Linux kit's playtest.sh, which ask them one at a
# time while the game runs, and into the macOS kit's macos-results.txt;
# the iOS list into the iPhone and iPad kit's ios-results.txt (called
# ipad-results.txt in older kits), and the Android list
# into the Android kit's android-results.txt. The results sheets
# are filled in by hand. test/playtest_kit_test.rb checks that every check
# has wording on every system, and that each phrase in +quotes+ is one the
# game shows (Presentation::Look), so a question never names a button by a
# word the game no longer uses.
#
# Each check has:
#   id       its number, which the results name it by
#   ask      what the player answers, as a statement to agree with or a
#            question, in the game's own words
#   answer   the kind of answer (left out when +parts+ holds them all):
#            yes_no (y / n / skip), yes_no_not_shown (also "not shown"),
#            rating (1 to 5, with +scale+), choice (one of +options+),
#            paste (y / n, then the pasted text), or describe (free text)
# and may have:
#   try      what to do before answering, shown first
#   restart  true when the kit waits for the player to quit the game and
#            starts it again before asking (a sheet asks the player to)
#   after    what to do once it is answered
#   group    controller, for checks asked only of a player with one
#   parts    further answers the check asks for, each with ask and answer
#   quotes   the phrases of +ask+ (or +try+) that the game itself shows
#
# A desktop check's try, ask, and after may differ by system: a mapping
# of windows, mac, and linux to their words, with default for the rest.
#
# Desktop checks are written with a mouse's words ("Click"), iOS's
# and Android's with a touch screen's ("Tap"). Windows wording stays in ASCII, since
# Windows PowerShell 5.1 reads a script without a byte order mark as ANSI.

desktop:
  - id: 1
    try: Play a round. Click a few bright dots, and listen.
    ask: Sound plays through your speakers or headphones.
    answer: yes_no

  - id: 2
    try:
      default: >-
        Go back to the title screen. Press M, or click the speaker icon in its
        corner, so the sound is off. Then quit Dot Popper with Escape on the
        title screen. The kit starts it again by itself.
      mac: >-
        Go back to the title screen. Press M, or click the speaker icon in its
        corner, so the sound is off. Then quit Dot Popper with Escape on the
        title screen, and open it again.
    restart: true
    ask: The sound is still off after quitting and starting again (the speaker icon still shows it off, and pops are silent).
    answer: yes_no
    after: Now press M again to turn the sound back on, for the checks that follow.

  - id: 3
    try: In a round, wait for the bright dot to come near each edge of the window (top, bottom, left and right), and click it there.
    ask: Clicking a bright dot near each edge pops it.
    answer: yes_no

  - id: 4
    try:
      default: Press F11, then F11 again. Then press Alt+Enter, then Alt+Enter again.
      mac: Press Command+Enter, then Command+Enter again.
    ask:
      default: F11 and Alt+Enter each switch fullscreen on and off, and the dots stay on screen each time.
      mac: Command+Enter switches fullscreen on and off, and the dots stay on screen each time.
    answer: yes_no

  - id: 5
    try:
      default: In the middle of a round, drag an edge or corner of the window to make it much smaller, then much bigger.
      windows: >-
        In the middle of a round, drag an edge or corner of the window to make it
        much smaller, then much bigger. (Windows pauses the game while you drag
        the window's edge. That is expected.)
    ask: Resizing the window mid-round keeps every dot on screen.
    answer: yes_no

  - id: 6
    try: With headphones or stereo speakers, pop a dot near the left edge, then one near the right edge.
    ask: Pops pan left and right, so a pop on the left sounds from the left and one on the right from the right.
    answer: yes_no

  - id: 7
    ask: The bright dot's edge is easy to see while it moves.
    answer: yes_no

  - id: 8
    try: >-
      After a round, look at the title screen for a "Dot size" choice. If it
      is there, click its other option ("Bigger" or "Smaller"), then play a round.
    ask: >-
      Picking the second option changes the size of the drifting dots on the
      title, and the next round's dots match. If the title shows no "Dot size"
      choice, answer ns, for not shown.
    answer: yes_no_not_shown
    quotes: [Dot size, Bigger, Smaller]

  - id: 9
    try:
      windows: On the Game Over screen, click "Share my score", then "Copy". Then open Notepad and paste (Ctrl+V).
      mac: On the Game Over screen, click "Share my score", then "Copy". Then open TextEdit and paste (Command+V).
      linux: On the Game Over screen, click "Share my score", then "Copy". Then open a text editor and paste (Ctrl+V).
    ask: The pasted result matches what the game showed, and reads sensibly.
    answer: paste
    quotes: [Share my score, Copy]

  - id: 10
    try: On the title screen, click "Your records" in the bottom left corner. Then click Back.
    ask: '"Your records" opens your records, and Back takes you back to the title. A click elsewhere on that screen does nothing.'
    answer: yes_no
    quotes: [Your records, Back]

  - id: 11
    ask: Text looks sharp, not blurry, at your display scale.
    answer: yes_no

  - id: 12
    try: >-
      On the Game Over screen, hold the mouse button down on a dot in the pile,
      drag it, and let go. Click once on empty space. Then click Continue.
    ask: Holding and dragging a pile dot throws it, a click on empty space does nothing, and Continue goes to the title.
    answer: yes_no
    quotes: [Continue]

  - id: 13
    ask: Overall, how does Dot Popper feel to play?
    answer: rating
    scale: 1 (not fun) to 5 (great)

  - id: 14
    group: controller
    try:
      default: Press F11 for fullscreen. Push the controller's left stick all the way, across the whole screen, and back. Then move the mouse.
      mac: Press Command+Enter for fullscreen. Push the controller's left stick all the way, across the whole screen, and back. Then move the mouse.
    ask: The cursor moves smoothly at full speed across the fullscreen window, and moving the mouse hides it.
    answer: yes_no
    parts:
      - ask: "The cursor's top speed:"
        answer: rating
        scale: 1 (much too slow), 3 (right), 5 (much too fast)

  - id: 15
    group: controller
    ask: A pops the bright dot under the cursor.
    answer: yes_no

  - id: 16
    group: controller
    ask: Start starts a round from the title screen, and continues after Game Over.
    answer: yes_no

  - id: 17
    group: controller
    try: On the title screen, press X. Then press B.
    ask: X opens "Your records", and B goes back to the title (the screen's button says "Back (B)").
    answer: yes_no
    quotes: [Your records, Back (B)]

  - id: 18
    group: controller
    try: On the Game Over screen, hold A with the cursor on a pile dot, move the cursor, and let go. Then push the right stick about.
    ask: Holding A on a pile dot drags it, and the right stick rolls the pile.
    answer: yes_no

ios:
  - id: 1
    try: Open Dot Popper from the Home Screen. Turn the iPhone or iPad to portrait, then to landscape.
    ask: The game fills the screen with no status bar, in portrait and in landscape.
    answer: yes_no

  - id: 2
    ask: A tap pops a bright dot right where your finger is.
    answer: yes_no

  - id: 3
    try: In a round, tap a popped (dark) dot on purpose, ideally one with the bright dot hiding under it. The title calls this "Tap a popped dot".
    ask: Tapping a popped dot costs 2 points and 2 seconds, and a dashed outline shows the bright dot it hid.
    answer: yes_no
    quotes: [Tap a popped dot]

  - id: 4
    ask: "How big a dot feels under your finger:"
    answer: choice
    options: [too small, right, too big]

  - id: 5
    try: Start some music in another app (Music, Spotify, a podcast), then switch to Dot Popper and pop a few dots. Then turn on Silent Mode (the switch on the side, or Control Center).
    ask: "The game's sound:"
    parts:
      - ask: plays at all
        answer: yes_no
      - ask: mixes with the music from the other app, which keeps playing
        answer: yes_no
      - ask: goes quiet in Silent Mode
        answer: yes_no

  - id: 6
    ask: Rotating the iPhone or iPad in the middle of a round keeps every dot on screen, each about where it was.
    answer: yes_no

  - id: 7
    try: On the Game Over screen, tilt the device one way and another, then give it a short shake.
    ask: Tilting at Game Over rolls the dots toward the lowest edge. (If they roll the wrong way, say in the note how you held the device.)
    answer: yes_no
    parts:
      - ask: A shake tosses them up.
        answer: yes_no

  - id: 8
    try: On the Game Over screen, drag a dot in the pile with your finger, and let go while moving. Tap once on empty space. Then tap Continue.
    ask: Dragging a pile dot with a finger throws it, a tap on empty space does nothing, and Continue goes to the title.
    answer: yes_no
    quotes: [Continue]

  - id: 9
    try: After a round, look at the title screen for a "Dot size" choice. If it is there, tap its other option ("Bigger" or "Smaller"), then play a round.
    ask: The Dot size choice changes the next round's dots. If the title shows no "Dot size" choice, write "not shown".
    answer: yes_no_not_shown
    quotes: [Dot size, Bigger, Smaller]

  - id: 10
    try: On the Game Over screen, tap "Share my score", then "Copy". Then open Notes and paste.
    ask: The pasted result matches what the game showed, and reads sensibly.
    answer: paste
    quotes: [Share my score, Copy]

  - id: 11
    group: controller
    try: Pair the Xbox controller in Settings > Bluetooth (hold its pairing button until the Xbox logo flashes fast), then play with it. Skip this check without a controller.
    ask: "With the Xbox controller paired:"
    parts:
      - ask: the left stick moves a cursor
        answer: yes_no
      - ask: A pops the bright dot under the cursor
        answer: yes_no
      - ask: Start starts a round
        answer: yes_no
      - ask: holding A on a pile dot at Game Over drags it
        answer: yes_no
      - ask: the right stick rolls the pile
        answer: yes_no

  - id: 12
    ask: Did anything crash, freeze, or look wrong? Describe it, and take a screenshot (press the top button and a volume button together) to send along.
    answer: describe

  - id: 13
    ask: Overall, how does Dot Popper feel to play?
    answer: rating
    scale: 1 (not fun) to 5 (great)
    parts:
      - ask: The player's first impression
        answer: describe

# The Android kit's checks (experimental), for a phone. Back is Android's
# own: the game takes it as Escape, so check 7 asks what it does on each
# screen. Check 14 says how to keep the log if the app fails at launch.
android:
  - id: 1
    try: Open Dot Popper from the app drawer. Turn the phone to portrait, then to landscape.
    ask: The game fills the screen in portrait and in landscape, with nothing hidden under the camera or the navigation bar.
    answer: yes_no

  - id: 2
    ask: A tap pops a bright dot right where your finger is.
    answer: yes_no

  - id: 3
    try: In a round, tap a popped (dark) dot on purpose, ideally one with the bright dot hiding under it. The title calls this "Tap a popped dot".
    ask: Tapping a popped dot costs 2 points and 2 seconds, and a dashed outline shows the bright dot it hid.
    answer: yes_no
    quotes: [Tap a popped dot]

  - id: 4
    ask: "How big a dot feels under your finger:"
    answer: choice
    options: [too small, right, too big]

  - id: 5
    ask: The phone gives a short buzz when you pop a dot and a slightly longer one when you tap a popped dot.
    answer: yes_no
    parts:
      - ask: The buzzes feel right, not annoying.
        answer: yes_no

  - id: 6
    try: Start some music in another app (YouTube Music, Spotify, a podcast), then switch to Dot Popper and pop a few dots. Press the volume buttons. Then set the phone to silent or vibrate.
    ask: "The game's sound:"
    parts:
      - ask: plays at all
        answer: yes_no
      - ask: mixes with the music from the other app, which keeps playing
        answer: yes_no
      - ask: gets louder and quieter with the volume buttons
        answer: yes_no
      - ask: goes quiet in silent or vibrate mode
        answer: yes_no

  - id: 7
    try: >-
      Press Back (the back button, or a swipe in from the left or right edge)
      on each screen in turn: on "Your records" (tap it on the title screen),
      during a round, at Game Over, and last on the title screen.
    ask: "What Back does:"
    parts:
      - ask: on Your records, it goes back to the title
        answer: yes_no
      - ask: during a round, it does nothing, and the round carries on
        answer: yes_no
      - ask: at Game Over, it goes on to the title, as Continue does
        answer: yes_no
      - ask: on the title screen, it leaves the app
        answer: yes_no
    quotes: [Your records]

  - id: 8
    ask: Rotating the phone in the middle of a round keeps every dot on screen.
    answer: yes_no

  - id: 9
    try: On the Game Over screen, tilt the phone one way and another, then give it a short shake.
    ask: Tilting at Game Over rolls the dots toward the lowest edge. (If they roll the wrong way, say in the note how you held the phone.)
    answer: yes_no
    parts:
      - ask: A shake tosses them up.
        answer: yes_no

  - id: 10
    try: On the Game Over screen, drag a dot in the pile with your finger, and let go while moving. Tap once on empty space. Then tap Continue.
    ask: Dragging a pile dot with a finger throws it, a tap on empty space does nothing, and Continue goes to the title.
    answer: yes_no
    quotes: [Continue]

  - id: 11
    try: After a round, look at the title screen for a "Dot size" choice. If it is there, tap its other option ("Bigger" or "Smaller"), then play a round.
    ask: The Dot size choice changes the next round's dots. If the title shows no "Dot size" choice, write "not shown".
    answer: yes_no_not_shown
    quotes: [Dot size, Bigger, Smaller]

  - id: 12
    try: On the Game Over screen, tap "Share my score", then "Copy". Then paste it into a message or a note.
    ask: The pasted result matches what the game showed, and reads sensibly.
    answer: paste
    quotes: [Share my score, Copy]

  - id: 13
    try: In the middle of a round, go to the Home screen, wait a few seconds, and open Dot Popper again.
    ask: The round carries on where it was, and the clock did not jump.
    answer: yes_no

  - id: 14
    ask: >-
      Did anything crash, freeze, or look wrong? Describe it, and take a
      screenshot (power and volume down together) to send along. If Dot
      Popper closed at launch, or Android said "Dot Popper keeps stopping",
      plug the phone into the computer with USB debugging on (README.txt,
      Way 1), run this on the computer, and send the file it writes along with this sheet:
      adb logcat -d > dot-popper-logcat.txt
    answer: describe

  - id: 15
    ask: Overall, how does Dot Popper feel to play?
    answer: rating
    scale: 1 (not fun) to 5 (great)
